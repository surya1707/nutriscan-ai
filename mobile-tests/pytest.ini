[pytest]
markers =
    smoke: minimal fast-path sanity checks, safe to run on every push
testpaths = tests
# Hard per-test ceiling. Observed healthy tests run 6-50s; 90s gives
# headroom without letting one stuck test/fixture burn the shard's
# 120-minute CI budget. Uses the default "signal" method (main-thread
# only, which is how pytest runs) — base_page.capture_failure() already
# disarms any pending alarm in a finally block so a timeout firing mid
# failure-capture can't crash the shard.
timeout = 90
timeout_method = signal
