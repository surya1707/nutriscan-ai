<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>NutriScan AI</title>
    <script>
      // GitHub Pages SPA redirect trick.
      // When GH Pages serves a 404 for a deep-link URL (e.g. /nutriscan-ai/scan),
      // this page captures the path and redirects to index.html with it encoded
      // in the query string, which the index.html script below then restores.
      var segmentCount = 1; // number of path segments in the repo base (1 for /<repo>/)
      var l = window.location;
      l.replace(
        l.protocol + '//' + l.hostname + (l.port ? ':' + l.port : '') +
        l.pathname.split('/').slice(0, 1 + segmentCount).join('/') + '/?p=/' +
        l.pathname.slice(1).split('/').slice(segmentCount).join('/').replace(/&/g, '~and~') +
        (l.search ? '&q=' + l.search.slice(1).replace(/&/g, '~and~') : '') +
        l.hash
      );
    </script>
  </head>
  <body></body>
</html>
