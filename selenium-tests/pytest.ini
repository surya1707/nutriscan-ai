[pytest]
markers =
    auth: Authentication tests
    authorization: Authorization / route-guarding tests
    navigation: Navigation and routing tests
    ui: UI validation tests
    forms: Form and input validation tests
    crud: Page-level (history/profile/results) tests
    error_handling: Error handling / network-failure tests
    session: Session management tests
    accessibility: Accessibility tests
    responsive: Responsive layout tests

addopts = -ra --strict-markers --tb=short
testpaths = tests
python_files = test_*.py
python_classes = Test*
python_functions = test_*

log_cli = false
