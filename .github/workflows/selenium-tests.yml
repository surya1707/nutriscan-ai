name: Web App Selenium Tests

# Everything runs in GitHub Actions — nothing here needs (or expects) a
# local machine. Default target is a `vite preview` server this workflow
# builds and starts itself (self-contained, doesn't depend on GitHub
# Pages having redeployed); `workflow_dispatch` lets you point it at the
# live Pages URL instead.
#
# Deliberately does NOT start the FastAPI backend (see selenium-tests/
# README.md "Why no backend"). Requests that would hit it are expected
# to fail, and the suite tests that the UI degrades gracefully — see
# tests/test_scan_network_handling.py.

on:
  push:
    branches: [main]
    paths:
      - 'web/**'
      - 'selenium-tests/**'
      - '.github/workflows/selenium-tests.yml'
  pull_request:
    paths:
      - 'web/**'
      - 'selenium-tests/**'
      - '.github/workflows/selenium-tests.yml'
  workflow_dispatch:
    inputs:
      target:
        description: 'What to test against'
        type: choice
        options: ['local-preview', 'deployed']
        default: 'local-preview'
      base_url:
        description: 'Only used when target=deployed. Full URL including trailing slash.'
        type: string
        default: 'https://surya1707.github.io/nutriscan-ai/'
      headless:
        description: 'Run Chrome headless'
        type: boolean
        default: true
      parallelism:
        description: 'pytest-xdist worker count'
        type: string
        default: '4'

permissions:
  contents: read

concurrency:
  group: selenium-tests-${{ github.ref }}
  cancel-in-progress: true

env:
  PARALLELISM: ${{ github.event.inputs.parallelism || '4' }}
  HEADLESS: ${{ github.event.inputs.headless || 'true' }}
  TARGET: ${{ github.event.inputs.target || 'local-preview' }}
  INPUT_BASE_URL: ${{ github.event.inputs.base_url || 'https://surya1707.github.io/nutriscan-ai/' }}

jobs:
  selenium-tests:
    name: Selenium E2E (web)
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      # ── Checkout ──────────────────────────────────────────────────
      - name: Checkout repository
        uses: actions/checkout@v4

      # ── Build the web app (only needed for local-preview target) ───
      - name: Set up Node.js
        if: env.TARGET == 'local-preview'
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: web/package.json

      - name: Install web dependencies
        if: env.TARGET == 'local-preview'
        working-directory: web
        run: npm install

      - name: Build web app
        if: env.TARGET == 'local-preview'
        working-directory: web
        env:
          # Optional — set these as repo secrets for full-fidelity Google/
          # email UI checks. The suite's core guest-mode tests do not
          # require them; see selenium-tests/README.md.
          VITE_API_URL: ${{ secrets.VITE_API_URL }}
          VITE_FIREBASE_API_KEY: ${{ secrets.VITE_FIREBASE_API_KEY }}
          VITE_FIREBASE_AUTH_DOMAIN: ${{ secrets.VITE_FIREBASE_AUTH_DOMAIN }}
          VITE_FIREBASE_PROJECT_ID: ${{ secrets.VITE_FIREBASE_PROJECT_ID }}
          VITE_FIREBASE_STORAGE_BUCKET: ${{ secrets.VITE_FIREBASE_STORAGE_BUCKET }}
          VITE_FIREBASE_MESSAGING_SENDER_ID: ${{ secrets.VITE_FIREBASE_MESSAGING_SENDER_ID }}
          VITE_FIREBASE_APP_ID: ${{ secrets.VITE_FIREBASE_APP_ID }}
        run: npm run build

      - name: Start vite preview server
        if: env.TARGET == 'local-preview'
        working-directory: web
        run: |
          npx vite preview --port 4173 --strictPort > /tmp/vite-preview.log 2>&1 &
          echo "Started vite preview (pid $!)"

      # ── Resolve the base URL both branches will use ─────────────────
      - name: Resolve BASE_URL
        id: resolve
        run: |
          if [ "${{ env.TARGET }}" = "local-preview" ]; then
            echo "base_url=http://localhost:4173/nutriscan-ai/" >> "$GITHUB_OUTPUT"
          else
            echo "base_url=${{ env.INPUT_BASE_URL }}" >> "$GITHUB_OUTPUT"
          fi

      # ── Health check: retry loop, GH Pages / preview boot isn't
      #    always instant ─────────────────────────────────────────────
      - name: Wait for target to be reachable
        run: |
          url="${{ steps.resolve.outputs.base_url }}"
          echo "Waiting for $url"
          for i in $(seq 1 30); do
            status=$(curl -s -o /dev/null -w "%{http_code}" "$url" || echo "000")
            if [ "$status" = "200" ]; then
              echo "Target is up (attempt $i, HTTP $status)"
              exit 0
            fi
            echo "Attempt $i: HTTP $status — retrying in 2s"
            sleep 2
          done
          echo "::error::Target never became reachable at $url"
          if [ -f /tmp/vite-preview.log ]; then
            echo "── vite preview log ──"
            cat /tmp/vite-preview.log
          fi
          exit 1

      # ── Browser + Python toolchain ───────────────────────────────────
      - name: Install Chrome
        id: setup-chrome
        uses: browser-actions/setup-chrome@v1
        with:
          chrome-version: stable

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'
          cache-dependency-path: selenium-tests/requirements.txt

      - name: Install Selenium suite dependencies
        working-directory: selenium-tests
        run: pip install -r requirements.txt

      # ── Run the suite ─────────────────────────────────────────────
      # continue-on-error: this step's exit code is NOT the gate — the
      # dedicated "Enforce pass-rate gate" step below is, and it only
      # runs after reports have already been generated and uploaded.
      - name: Run Selenium tests
        id: pytest
        continue-on-error: true
        working-directory: selenium-tests
        env:
          CHROME_PATH: ${{ steps.setup-chrome.outputs.chrome-path }}
          BASE_URL: ${{ steps.resolve.outputs.base_url }}
        run: |
          HEADED_FLAG=""
          if [ "${{ env.HEADLESS }}" = "false" ]; then
            HEADED_FLAG="--headed"
          fi
          python -m pytest \
            -n "${{ env.PARALLELISM }}" \
            --reruns 2 --reruns-delay 2 \
            --base-url "${{ steps.resolve.outputs.base_url }}" \
            $HEADED_FLAG \
            -v

      - name: Generate reports
        if: always()
        working-directory: selenium-tests
        run: python scripts/generate_reports.py

      - name: Write job summary
        if: always()
        run: |
          if [ -f selenium-tests/reports/summary.md ]; then
            cat selenium-tests/reports/summary.md >> "$GITHUB_STEP_SUMMARY"
          else
            echo "No summary.md was generated — see uploaded artifacts / logs." >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: selenium-reports
          path: |
            selenium-tests/reports/**
          retention-days: 30
          if-no-files-found: warn

      - name: Upload screenshots on failure
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: selenium-screenshots
          path: selenium-tests/reports/screenshots/**
          retention-days: 30
          if-no-files-found: ignore

      # ── The actual pass/fail gate — runs LAST, after everything
      #    above has already been uploaded ─────────────────────────
      - name: Enforce pass-rate gate
        if: always()
        working-directory: selenium-tests
        run: python scripts/check_pass_rate.py
