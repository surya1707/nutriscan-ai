name: Android E2E Tests (Appium + Flutter Driver)

# Sharded across 4 emulator jobs, each running its own AVD + Appium
# server + a slice of mobile-tests/tests/*.py, then merged into one
# Automation_Test_Report.xlsx by the `merge-reports` job.
#
# Runs on ubuntu-latest with KVM hardware acceleration enabled (GitHub
# turned this on for hosted Linux runners in Jan 2024 — ~15s emulator
# boot vs. ~1min20s+ on macOS, and avoids the well-documented HVF/
# nested-virtualization instability on Apple Silicon macOS runners).

on:
  push:
    branches: [main]
    paths:
      - 'mobile/**'
      - 'mobile-tests/**'
      - '.github/workflows/android-e2e.yml'
  pull_request:
    paths:
      - 'mobile/**'
      - 'mobile-tests/**'
      - '.github/workflows/android-e2e.yml'
  workflow_dispatch:
    inputs:
      pass_rate_threshold:
        description: 'Minimum pass rate (%) required for the job to succeed'
        type: string
        default: '90'

permissions:
  contents: read

concurrency:
  group: android-e2e-${{ github.ref }}
  # KrishiIQ (the working reference project) uses false here. With true,
  # pushing a new commit mid-run kills every in-flight shard instantly —
  # a real risk given how often this workflow gets re-pushed while
  # iterating on fixes. Shards have also been landing within ~5-10min of
  # the 120min job cap on their own; losing a near-complete run to a
  # stray push on top of that is worth avoiding.
  cancel-in-progress: false

env:
  PASS_RATE_THRESHOLD: ${{ github.event.inputs.pass_rate_threshold || '90' }}

jobs:
  build-apk:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.27.1'
          channel: 'stable'
          cache: true

      - name: flutter pub get
        working-directory: mobile
        run: flutter pub get

      - name: Write firebase_options.dart from secret
        working-directory: mobile
        env:
          FIREBASE_OPTIONS_DART: ${{ secrets.FIREBASE_OPTIONS_DART }}
        run: |
          if [ -z "$FIREBASE_OPTIONS_DART" ]; then
            echo "::error::Repo secret FIREBASE_OPTIONS_DART is not set. Copy the contents of your local mobile/lib/firebase_options.dart (git-ignored, generated by 'flutterfire configure') into a repo secret with that name."
            exit 1
          fi
          echo "$FIREBASE_OPTIONS_DART" > lib/firebase_options.dart

      - name: Write google-services.json from secret
        working-directory: mobile
        env:
          GOOGLE_SERVICES_JSON: ${{ secrets.GOOGLE_SERVICES_JSON }}
        run: |
          if [ -z "$GOOGLE_SERVICES_JSON" ]; then
            echo "::error::Repo secret GOOGLE_SERVICES_JSON is not set. Copy the contents of your local mobile/android/app/google-services.json (git-ignored, downloaded from the Firebase console) into a repo secret with that name."
            exit 1
          fi
          echo "$GOOGLE_SERVICES_JSON" > android/app/google-services.json

      - name: Build debug APK from the test entrypoint
        working-directory: mobile
        run: flutter build apk --debug -t lib/main_test.dart

      - uses: actions/upload-artifact@v4
        with:
          name: test-apk
          path: mobile/build/app/outputs/flutter-apk/app-debug.apk
          retention-days: 7

  android-e2e:
    needs: build-apk
    runs-on: ubuntu-latest
    # Was 120. Shard 3 (5 modules incl. the heaviest/flakiest: camera,
    # offline, session, error, messaging) provably ran out of time and
    # left 26 tests "never executed"; shard 2 disappeared entirely mid-run
    # with zero results uploaded. This workflow's own prior comment
    # already admitted shards were landing within 5-10min of the 120min
    # cap "on their own" — i.e. already living on the edge before any bad
    # luck. Raised to 180 for headroom, combined with the shard rebalance
    # below (was 4/4/5/3 modules, now an even 4/4/4/4 with the
    # heavy/flaky modules spread across different shards instead of
    # stacked in one) and the continue_as_guest() text-match fix in
    # pages/auth_page.py (was silently burning ~15s per test on every
    # single guest login across nearly the whole suite).
    #
    # That first rebalance wasn't enough: shard 4 (camera_file_upload +
    # error_handling + profile_management + session_management) still
    # died outright — GitHub killed the runner mid-run ("received a
    # shutdown signal") after ~40min, and both raw-results and
    # failure-evidence uploads were skipped entirely (a job-level crash,
    # not a test failure). The shard-4 log showed a ~90s stall-then-rerun
    # cycle recurring every ~90s across camera_file_upload AND
    # error_handling — every test force-stops+relaunches the app
    # (reset_to_guest_home), and both of those files additionally cycle
    # the Scanner's CameraController/Impeller GPU context dozens of times
    # each (flash toggle x8, entry/exit stress x10, camera permission
    # grant/revoke, repeated-permission-toggle x8) on top of that. The
    # emulator runs on swiftshader_indirect (software Vulkan) which is
    # known to leak slowly across repeated context create/destroy; having
    # BOTH camera-heavy files stacked in one shard concentrated that churn
    # enough to exhaust the runner. Every other shard has at most one
    # relaunch-heavy file. Rebalanced so no shard contains more than one
    # of {test_camera_file_upload.py, test_error_handling.py,
    # test_session_management.py} — the three files whose tests
    # individually trigger a force-stop+relaunch (or, for the first two,
    # a fresh GPU context) most often.
    timeout-minutes: 180
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4]
        include:
          - shard: 1
            files: "tests/test_camera_file_upload.py tests/test_forms.py tests/test_home_dashboard.py tests/test_responsive_ui.py"
          - shard: 2
            files: "tests/test_error_handling.py tests/test_input_validation.py tests/test_list_browsing_and_filters.py tests/test_accessibility.py"
          - shard: 3
            files: "tests/test_session_management.py tests/test_authentication.py tests/test_authorization.py tests/test_inapp_messaging.py"
          - shard: 4
            files: "tests/test_profile_management.py tests/test_navigation.py tests/test_offline_handling.py tests/test_scan_history_crud.py"

    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          name: test-apk
          path: mobile-tests/apk

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install Appium + test dependencies
        run: |
          npm install -g appium@2.19.0 --no-fund --no-audit
          appium driver install uiautomator2@4.2.9
          appium driver install --source=npm appium-flutter-driver@2.19.0
          pip install -r mobile-tests/requirements.txt --break-system-packages || \
            pip install -r mobile-tests/requirements.txt

      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Run Android emulator + Appium server + shard tests
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 33
          target: google_apis
          arch: x86_64
          profile: pixel_5
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back emulated
          disable-animations: true
          script: chmod +x mobile-tests/scripts/ci_run_shard.sh && mobile-tests/scripts/ci_run_shard.sh "${{ matrix.shard }}" ${{ matrix.files }}

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: raw-results-shard-${{ matrix.shard }}
          path: |
            mobile-tests/reports/raw-results.jsonl
            mobile-tests/reports/collected-shard-${{ matrix.shard }}.txt
          retention-days: 14
          # Was 'warn'. A shard that produces literally nothing (e.g. it
          # died badly enough mid-run that ci_run_shard.sh's own report
          # files never got written) used to just log a warning and
          # vanish from the merged report - the exact failure mode that
          # made "300 tests instead of ~400" look like a reporting bug
          # instead of what it was: shard 2 silently contributing zero
          # results. Now it fails this job's upload step loudly instead.
          if-no-files-found: error

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: failure-evidence-shard-${{ matrix.shard }}
          # capture_failure() in pages/base_page.py writes BOTH a
          # screenshot and a logcat dump per failed test, but only the
          # screenshots dir was ever uploaded — the logcat files (often
          # more useful than a screenshot for a driver-connection-death
          # failure, since they show what the app/OS was doing at the
          # moment of failure) were silently discarded at the end of
          # every run. Uploading both dirs together as one artifact so
          # a failed module's evidence is in one place.
          path: |
            mobile-tests/reports/screenshots
            mobile-tests/reports/logs
          retention-days: 14
          if-no-files-found: ignore

  merge-reports:
    needs: android-e2e
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - run: pip install openpyxl --break-system-packages || pip install openpyxl

      - uses: actions/download-artifact@v4
        with:
          pattern: raw-results-shard-*
          path: mobile-tests/reports/_shards
          merge-multiple: false

      - name: Merge shard result files into one raw-results.jsonl
        run: |
          mkdir -p mobile-tests/reports
          find mobile-tests/reports/_shards -name 'raw-results.jsonl' -exec cat {} + \
            > mobile-tests/reports/raw-results.jsonl || true
          find mobile-tests/reports/_shards -name 'collected-shard-*.txt' -exec cat {} + \
            > mobile-tests/reports/collected-all.txt || true

      - name: Verify all 4 shards reported in
        run: |
          FOUND=$(find mobile-tests/reports/_shards -maxdepth 1 -type d -name 'raw-results-shard-*' | wc -l)
          echo "Shards with a results artifact: ${FOUND} / 4"
          if [ "${FOUND}" -lt 4 ]; then
            echo "::warning::Only ${FOUND}/4 shards uploaded results — the totals below are undercounted, not a report bug. Check the android-e2e job list for a red/missing shard."
          fi

      - uses: actions/download-artifact@v4
        with:
          pattern: failure-evidence-shard-*
          path: mobile-tests/reports/_failure_evidence
          merge-multiple: false
        continue-on-error: true  # ignore() upstream means this can legitimately not exist

      - name: Consolidate failure evidence + summarize per module
        run: |
          mkdir -p mobile-tests/reports/Failure_Evidence
          if [ -d mobile-tests/reports/_failure_evidence ]; then
            # Flatten shard-N/screenshots and shard-N/logs into
            # Failure_Evidence/shard-N/{screenshots,logs} so one artifact
            # download gives you everything, organized by shard, instead
            # of having to open 4 separate screenshots-shard-N artifacts.
            for shard_dir in mobile-tests/reports/_failure_evidence/failure-evidence-shard-*; do
              [ -d "$shard_dir" ] || continue
              name=$(basename "$shard_dir")
              num=${name##*-}
              mkdir -p "mobile-tests/reports/Failure_Evidence/shard-${num}"
              cp -r "$shard_dir"/. "mobile-tests/reports/Failure_Evidence/shard-${num}/" 2>/dev/null || true
            done
          fi

          {
            echo ""
            echo "## Failure evidence"
            TOTAL_SHOTS=$(find mobile-tests/reports/Failure_Evidence -iname '*.png' 2>/dev/null | wc -l)
            TOTAL_LOGS=$(find mobile-tests/reports/Failure_Evidence -iname '*.log' 2>/dev/null | wc -l)
            if [ "${TOTAL_SHOTS}" -eq 0 ] && [ "${TOTAL_LOGS}" -eq 0 ]; then
              echo "No failure screenshots/logcat were captured for this run."
            else
              echo "${TOTAL_SHOTS} screenshot(s) and ${TOTAL_LOGS} logcat file(s) captured — see the \`Failure_Evidence\` artifact."
              echo ""
              echo "| Shard | Screenshots | Logcat files |"
              echo "|---|---|---|"
              for shard_dir in mobile-tests/reports/Failure_Evidence/shard-*; do
                [ -d "$shard_dir" ] || continue
                num=$(basename "$shard_dir" | sed 's/shard-//')
                shots=$(find "$shard_dir" -iname '*.png' 2>/dev/null | wc -l)
                logs=$(find "$shard_dir" -iname '*.log' 2>/dev/null | wc -l)
                echo "| ${num} | ${shots} | ${logs} |"
              done
            fi
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Generate consolidated Automation_Test_Report.xlsx
        working-directory: mobile-tests
        run: python scripts/generate_reports.py

      - name: Write job summary
        if: always()
        run: |
          if [ -f mobile-tests/reports/summary.md ]; then
            cat mobile-tests/reports/summary.md >> "$GITHUB_STEP_SUMMARY"
          else
            echo "No summary.md was generated — see uploaded artifacts / logs." >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Enforce pass-rate gate
        working-directory: mobile-tests
        env:
          PASS_RATE_THRESHOLD: ${{ env.PASS_RATE_THRESHOLD }}
        run: python scripts/check_pass_rate.py

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: Automation_Test_Report
          path: |
            mobile-tests/reports/Automation_Test_Report.xlsx
            mobile-tests/reports/execution-results.json
            mobile-tests/reports/summary.md
          retention-days: 30

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: Failure_Evidence
          path: mobile-tests/reports/Failure_Evidence
          retention-days: 30
          if-no-files-found: ignore