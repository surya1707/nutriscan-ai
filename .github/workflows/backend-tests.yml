name: Backend Tests

on:
  push:
    branches: [main]
    paths:
      - 'backend/**'
      - '.github/workflows/backend-tests.yml'
  pull_request:
    paths:
      - 'backend/**'
      - '.github/workflows/backend-tests.yml'
  workflow_dispatch:

defaults:
  run:
    working-directory: backend

jobs:
  # ---------------------------------------------------------------------
  # Static analysis: bandit (SAST) + pip-audit (dependency CVEs).
  # Report-only for pip-audit (transitive CVEs land in almost every real
  # project and shouldn't hard-block a student/portfolio CI on their own);
  # bandit fails the build only on a HIGH-severity, HIGH-confidence finding.
  # ---------------------------------------------------------------------
  sast:
    name: SAST (bandit + pip-audit)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install app + test dependencies
        run: |
          pip install -r requirements.txt -r requirements-dev.txt -r requirements-test.txt

      - name: Run bandit
        run: |
          bandit -r app -f json -o bandit-report.json || true
          bandit -r app -f txt

      - name: Fail on high-severity, high-confidence bandit findings
        run: |
          python -c "
          import json, sys
          report = json.load(open('bandit-report.json'))
          blocking = [
              r for r in report['results']
              if r['issue_severity'] == 'HIGH' and r['issue_confidence'] == 'HIGH'
          ]
          if blocking:
              print(f'{len(blocking)} HIGH severity / HIGH confidence bandit finding(s):')
              for b in blocking:
                  print(f\"  {b['filename']}:{b['line_number']} - {b['test_id']} {b['issue_text']}\")
              sys.exit(1)
          print('No blocking bandit findings.')
          "

      - name: Run pip-audit (report only)
        run: pip-audit -r requirements.txt || true

      - name: Upload SAST artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: sast-reports
          path: backend/bandit-report.json
          retention-days: 30

  # ---------------------------------------------------------------------
  # Functional + security pytest suite, with coverage and the xlsx report
  # generator. This is the primary gate: any non-xfail test failure fails
  # the build. Known, tracked gaps use strict xfail (see
  # tests/functional/test_history_functional.py) so they show up as an
  # explicit XPASS-failure the moment someone fixes the underlying issue,
  # rather than silently staying stale.
  # ---------------------------------------------------------------------
  backend-tests:
    name: Functional + Security Tests
    runs-on: ubuntu-latest
    services:
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 5

    env:
      DATABASE_URL: "sqlite+aiosqlite:///:memory:"
      REDIS_URL: "redis://localhost:6379/0"
      SECRET_KEY: "ci-test-secret-not-used-in-production"
      ENVIRONMENT: "development"
      ALLOWED_ORIGINS: "http://localhost:5173,https://nutriscan.app"
      # FIREBASE_CREDENTIALS_PATH deliberately unset here: under pytest,
      # app/core/firebase.py short-circuits before ever needing it (see
      # tests/conftest.py raw_client fixture docstring for why that's
      # still meaningful test coverage, not a shortcut).

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Install app + test dependencies
        run: |
          pip install -r requirements.txt -r requirements-dev.txt -r requirements-test.txt

      - name: Run pytest (functional + security, with coverage)
        run: |
          python -m pytest tests/ \
            -v \
            --cov=app --cov-report=term-missing --cov-report=html:coverage-html \
            --json-report --json-report-file=/tmp/pytest-report.json \
            --junitxml=junit-report.xml

      - name: Generate test-case catalog + findings workbook
        if: always()
        run: |
          cp /tmp/pytest-report.json /tmp/pytest-report.json 2>/dev/null || true
          python tests/reporting/generate_reports.py

      - name: Job summary
        if: always()
        run: |
          if [ -f tests/reporting/output/summary.md ]; then
            cat tests/reporting/output/summary.md >> "$GITHUB_STEP_SUMMARY"
          else
            echo "No summary.md was generated — see uploaded artifacts / logs." >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Upload test reports + coverage
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: backend-test-reports
          path: |
            backend/coverage-html/
            backend/junit-report.xml
            backend/tests/reporting/output/*.xlsx
          retention-days: 30

  # ---------------------------------------------------------------------
  # k6 load/smoke test against a REAL live server process.
  #
  # SCOPE (see backend/load/k6-load-test.js for the full explanation):
  # the live server needs Firebase Admin to initialize or it exits
  # immediately (confirmed by direct testing -- this is not hypothetical).
  # There's no real Firebase project available here, so a throwaway,
  # locally-generated service-account JSON is used ONLY to let the process
  # boot. It contains no real secrets and cannot verify a real ID token,
  # which is why this job only load-tests the endpoints that don't require
  # one (health, root, scan/analyse, scan/barcode). Informational --
  # doesn't block the merge gate the way backend-tests does, since shared
  # CI runners are not a reliable environment for hard latency SLOs.
  # ---------------------------------------------------------------------
  load-test:
    name: k6 Load Test (unauthenticated endpoints)
    runs-on: ubuntu-latest
    needs: backend-tests
    continue-on-error: true
    services:
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379

    env:
      DATABASE_URL: "sqlite+aiosqlite:///./ci_load_test.db"
      REDIS_URL: "redis://localhost:6379/0"
      SECRET_KEY: "ci-test-secret-not-used-in-production"
      ENVIRONMENT: "development"
      ALLOWED_ORIGINS: "http://localhost:5173"

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Install app + test dependencies
        run: pip install -r requirements.txt -r requirements-test.txt

      - name: Generate throwaway CI-only Firebase credentials
        run: |
          python tests/reporting/ci_helpers/gen_fake_firebase_creds.py /tmp/ci-fake-firebase-creds.json

      - name: Boot live server
        run: |
          FIREBASE_CREDENTIALS_PATH=/tmp/ci-fake-firebase-creds.json \
            nohup python -m uvicorn app.main:app --host 127.0.0.1 --port 8000 > server.log 2>&1 &
          for i in $(seq 1 15); do
            if curl -sf http://127.0.0.1:8000/health > /dev/null; then
              echo "Server is up."; exit 0
            fi
            sleep 1
          done
          echo "Server failed to start:"; cat server.log; exit 1

      - name: Install k6
        run: |
          curl -sL https://github.com/grafana/k6/releases/download/v0.54.0/k6-v0.54.0-linux-amd64.tar.gz -o k6.tar.gz
          tar xzf k6.tar.gz
          sudo mv k6-v0.54.0-linux-amd64/k6 /usr/local/bin/k6

      - name: Run k6 load test
        run: |
          BASE_URL=http://127.0.0.1:8000 k6 run --summary-export=k6-summary.json load/k6-load-test.js

      - name: Server log (on failure)
        if: failure()
        run: cat backend/server.log

      - name: Upload k6 summary
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: k6-load-test-summary
          path: backend/k6-summary.json
          retention-days: 30
